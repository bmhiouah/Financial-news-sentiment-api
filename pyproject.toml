[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sentiment"
version = "0.1.0"
description = "Financial news sentiment pipeline: OpenBB -> news -> FinBERT -> PostgreSQL."
requires-python = ">=3.10"
dependencies = [
    "openbb==3.5.0",
    "finnhub-python",
    "requests",
    "transformers",
    "torch",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas",
    "pgserver",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
financial-sentiment = "financial_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
financial_sentiment = ["api/static/*"]
