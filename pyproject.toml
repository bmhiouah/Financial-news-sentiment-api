[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sentiment"
version = "0.1.0"
description = "Financial news sentiment pipeline: OpenBB -> news -> FinBERT -> PostgreSQL."
requires-python = ">=3.10"
dependencies = [
    "openbb==4.7.2",
    "finnhub-python",
    "requests",
    "transformers==4.49.0",
    "torch==2.13.0",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "numpy==1.26.4",
    "pandas==2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pgserver",
]

[project.scripts]
financial-sentiment = "financial_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
financial_sentiment = ["api/static/*"]
