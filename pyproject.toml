[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sentiment"
version = "0.1.0"
description = "Financial news sentiment pipeline: OpenBB -> news -> FinBERT -> PostgreSQL."
requires-python = ">=3.10"
# Keep this list in sync with config/requirements.txt: Docker installs the
# pinned runtime stack from that file, then runs `pip install --no-deps .`.
dependencies = [
    "openbb==4.7.2",
    "finnhub-python",
    "requests",
    "transformers==4.49.0",
    "torch==2.13.0",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "numpy==1.26.4",
    "pandas==2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pgserver",
]

[project.scripts]
financial-sentiment = "financial_sentiment.cli:main"

# Flat layout: the package sits at the project root, one level above its modules.
# `include` keeps docs/, config/ and scripts/ out of the wheel.
[tool.setuptools.packages.find]
include = ["financial_sentiment*"]

[tool.setuptools.package-data]
financial_sentiment = ["api/static/*"]
